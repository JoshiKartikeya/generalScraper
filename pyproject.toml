[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samaco-scraper"
version = "0.1.0"
description = "Reusable HTTP + browser scraping framework"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "selectolax>=0.3.21",
  "playwright>=1.52.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
